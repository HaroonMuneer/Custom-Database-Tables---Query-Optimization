name: hm-cte-isolated
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: hm_test_root_only
      MYSQL_DATABASE: hm_cte_test
      MYSQL_USER: hm_test
      MYSQL_PASSWORD: hm_test_only
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: hm_test
      WORDPRESS_DB_PASSWORD: hm_test_only
      WORDPRESS_DB_NAME: hm_cte_test
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'SAVEQUERIES', filter_var( getenv( 'HM_CTE_SAVEQUERIES' ), FILTER_VALIDATE_BOOLEAN ) );
      HM_CTE_SAVEQUERIES: ${HM_CTE_SAVEQUERIES:-false}
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/hm-custom-table-engine:ro
  cli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: hm_test
      WORDPRESS_DB_PASSWORD: hm_test_only
      WORDPRESS_DB_NAME: hm_cte_test
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'SAVEQUERIES', filter_var( getenv( 'HM_CTE_SAVEQUERIES' ), FILTER_VALIDATE_BOOLEAN ) );
      HM_CTE_SAVEQUERIES: ${HM_CTE_SAVEQUERIES:-false}
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/hm-custom-table-engine:ro
    entrypoint: ["wp"]
  standards:
    image: composer:2
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: ["sh", "-lc"]
    command: "composer install --no-interaction && vendor/bin/phpcs -ps --standard=WordPress hm-custom-table-engine.php uninstall.php includes tests"
volumes:
  db_data:
  wp_data:
